<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- panel shadow -->
  <rect x="16" y="16" width="30" height="28" rx="6" fill="#E6F5FF" opacity="0.7"/>
  <!-- panel body -->
  <rect x="14" y="14" width="30" height="28" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <!-- top lights -->
  <circle cx="20" cy="19" r="2.2" fill="#FF8AAE" stroke="#333333" stroke-width="1"/>
  <circle cx="27" cy="19" r="2.2" fill="#FFD166" stroke="#333333" stroke-width="1"/>
  <circle cx="34" cy="19" r="2.2" fill="#7BDFF2" stroke="#333333" stroke-width="1"/>
  <!-- slider track -->
  <rect x="19" y="26" width="20" height="3" rx="1.5" fill="#E2E2F9"/>
  <circle cx="29" cy="27.5" r="3" fill="#FFCAD4" stroke="#333333" stroke-width="1.2"/>
  <!-- auto label -->
  <rect x="19" y="31" width="14" height="6" rx="3" fill="#F3F3FF"/>
  <text x="20.5" y="35.5" font-size="4.5" fill="#555555" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">AUTO</text>
</svg>

