<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- sticky note shadow -->
  <rect x="14" y="16" width="32" height="30" rx="7" fill="#E6F5FF" opacity="0.7"/>
  <!-- sticky note -->
  <rect x="12" y="14" width="32" height="30" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <!-- tape -->
  <rect x="18" y="10" width="20" height="5" rx="2.5" fill="#FFE6A7" stroke="#333333" stroke-width="1.5"/>
  <!-- handwriting lines -->
  <path d="M17 22 H39" stroke="#777777" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M17 26 H35" stroke="#777777" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M17 30 H33" stroke="#777777" stroke-width="1.4" stroke-linecap="round"/>
  <!-- wavy emphasis -->
  <path d="M19 34 C21 32.5, 23 35.5, 25 34 C27 32.5, 29 35.5, 31 34"
        stroke="#FF8AAE" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <!-- tiny projector icon -->
  <rect x="32" y="26" width="10" height="7" rx="2" fill="#E2E2F9" stroke="#333333" stroke-width="1.3"/>
  <circle cx="35" cy="29.5" r="1.4" fill="#7BDFF2"/>
  <circle cx="38" cy="29.5" r="1.4" fill="#FFB3C6"/>
</svg>

