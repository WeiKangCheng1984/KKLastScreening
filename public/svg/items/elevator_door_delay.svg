<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- panel shadow -->
  <rect x="18" y="16" width="28" height="30" rx="7" fill="#FFF4E0" opacity="0.7"/>
  <!-- panel body -->
  <rect x="16" y="14" width="28" height="30" rx="7" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <!-- door representation -->
  <rect x="20" y="18" width="8" height="16" rx="2" fill="#E2E2F9"/>
  <rect x="28" y="18" width="8" height="16" rx="2" fill="#D9F2FF"/>
  <!-- delay clock -->
  <circle cx="30" cy="36" r="4.5" fill="#FFE6F0" stroke="#333333" stroke-width="1.4"/>
  <line x1="30" y1="36" x2="30" y2="34" stroke="#333333" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="30" y1="36" x2="32" y2="37" stroke="#333333" stroke-width="1.3" stroke-linecap="round"/>
  <!-- "+3s" -->
  <text x="22" y="37" font-size="4.5" fill="#FF8AAE" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">+3s</text>
</svg>

