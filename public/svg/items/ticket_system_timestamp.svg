  <rect x="8" y="12" width="40" height="30" rx="9" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <!-- perforation -->
  <line x1="22" y1="12" x2="22" y2="42" stroke="#B3CDE8" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- text rows -->
  <rect x="25" y="18" width="16" height="4" rx="2" fill="#FFCAD4"/>
  <rect x="25" y="24" width="14" height="3" rx="1.5" fill="#E2E2F9"/>
